<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACHKILA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-slate-900">

    <header class="w-full min-h-[74px] bg-slate-800 border-b border-slate-700 px-5 py-3 flex flex-wrap items-center justify-between gap-4 text-white">

        <div class="flex items-center gap-2">
            <img class="size-12 shrink-0" src="image/ball.png" alt="Ballon de football">
            <h1>TACHKILA</h1>
        </div>

        <nav>
            <ul class="flex items-center gap-6">
                <li class="flex items-center gap-2 text-sm font-bold text-amber-400">
                    <span class="w-3 h-3 rounded-full bg-amber-500"></span>GB
                </li>
                <li class="flex items-center gap-2 text-sm font-bold text-blue-400">
                    <span class="w-3 h-3 rounded-full bg-blue-500"></span>DEF
                </li>
                <li class="flex items-center gap-2 text-sm font-bold text-green-400">
                    <span class="w-3 h-3 rounded-full bg-green-500"></span>MIL
                </li>
                <li class="flex items-center gap-2 text-sm font-bold text-red-400">
                    <span class="w-3 h-3 rounded-full bg-red-500"></span>ATT
                </li>
            </ul>
        </nav>

        <div class="flex items-center gap-3">
            <span class="text-gray-400">Schéma</span>
            <button class="bg-slate-900 border border-slate-700 rounded-md px-3 py-2">
                4-4-2
            </button>
        </div>

    </header>

    <!-- div containir -->
    <div class="flex min-h-[calc(100vh-74px)]">

        <!-- ASIDE -->
        <aside class="w-80 shrink-0 bg-slate-800 p-4 text-white border-r border-slate-700">

            <button class="rounded-xl bg-green-600 px-4 py-3 font-bold hover:bg-green-700 w-full">
                + Ajouter un joueur
            </button>

            <div class="flex justify-between mt-6">
                <h3>Effectif</h3>
                <p class="border border-slate-700 bg-slate-700 rounded-md px-3">
                    1 joueur
                </p>
            </div>

            <p class="text-sm text-slate-400 mt-4">
                Cliquez sur un joueur placé pour voir sa case sur le terrain.
                🖊️ pour modifier, 🗑️ pour supprimer.
            </p>

            <div class="rounded-xl border-l border-red-500 bg-slate-700 p-3 mt-4">
                <div class="flex gap-3">
                    <span class="rounded-full border border-red-500 h-9 w-9 flex items-center justify-center">
                        1
                    </span>

                    <div class="flex-1">
                        <h3>Bono</h3>
                        <p class="text-orange-400 text-sm">Gardien</p>
                    </div>

                    <button type="button" aria-label="Modifier">🖊️</button>
                    <button type="button" aria-label="Supprimer">🗑️</button>
                </div>

                <select class="mt-3 w-full rounded-md border border-slate-500 bg-slate-700 p-2 text-sm text-white">
                    <option>Sur le banc</option>
                    <option>GB - Gardien</option>
                    <option>DG - Défenseur gauche</option>
                    <option>DC - Défenseur central 1</option>
                    <option>DC - Défenseur central 2</option>
                    <option>DD - Défenseur droit</option>
                    <option>MG - Milieu gauche</option>
                    <option>MC - Milieu central 1</option>
                    <option>MC - Milieu central 2</option>
                    <option>MD - Milieu droit</option>
                    <option>BU - Buteur 1</option>
                    <option>BU - Buteur 2</option>
                </select>
            </div>

        </aside>

        <!-- MAIN -->
        <main class="flex-1  bg-slate-900 p-6">
            <div class="containir">

               <div class="case red bu1">BU</div>
               <div class="case red bu2 ">BU</div>
               <div class="case yell gb"><span>1</span><p>GB BONO</p></div>
