<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TACHKILA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="Js/page-effectif.js" defer></script>
</head>

<body class="min-h-screen bg-slate-900">

<header class=" fixed top-0 left-0 w-full  border-b border-slate-700 px-4 py-3 text-white shadow-lg ">

  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4">

    <div class="flex items-center gap-2">
      <img 
        class="w-10 h-10 sm:w-12 sm:h-12 "
        src="image/ball.png"
        alt="Ballon de football"
      >
      <h1 class="text-xl sm:text-2xl font-bold">TACHKILA</h1>
    </div>

    <nav>
      <ul class="flex flex-wrap items-center gap-4 cursor-pointer bg-slate-900 border border-slate-700 py-4 px-3 rounded-lg  ">
        <li><a href="index.html"  class="bg-green-500 p-2 font-bold rounded-lg" >Effectif</a></li>
        <li><a href="composition.html">Composition</a></li>
        <li><a href="matchs.html">Matches</a></li>
      </ul>
    </nav>


    <nav class="relative">
      <ul class="flex flex-wrap items-center justify-center gap-3 sm:gap-6">

        <li class="flex items-center gap-2 text-xs sm:text-sm font-bold text-amber-400">
          <span class="w-3 h-3 rounded-full bg-amber-500"></span>
          GB
        </li>

        <li class="flex items-center gap-2 text-xs sm:text-sm font-bold text-blue-400">
          <span class="w-3 h-3 rounded-full bg-blue-500"></span>
          DEF
        </li>

        <li class="flex items-center gap-2 text-xs sm:text-sm font-bold text-green-400">
          <span class="w-3 h-3 rounded-full bg-green-500"></span>
          MIL
        </li>

        <li class="flex items-center gap-2 text-xs sm:text-sm font-bold text-red-400">
          <span class="w-3 h-3 rounded-full bg-red-500"></span>
          ATT
        </li>

      </ul>
    </nav>
  </div>
     </header>

  
  <main class="pt-40 sm:pt-36 xl:pt-28">

    <section class="flex justify-between m-6 ">
      <div class="flex flex-col">
        <h3 class="text-white font-bold text-xl">Effectif</h3>
        <p class="text-slate-400">Gérer les joueur du club Atlas FC.</p>
      </div>
        
      <button type="button" id="ouvrir" class="rounded-lg bg-green-600 px-5 py-3 font-semibold
       text-white hover:bg-green-700 ">
        + Ajouter un joueur
      </button>
      <div id="modale" class="fixed inset-0  hidden items-center justify-center bg-black/60 p-4">

        <div class="w-full max-w-xl rounded-2xl border border-slate-700 bg-slate-800 p-7 text-white shadow-2xl">

          <div class="mb-8 flex items-center justify-between">
            <h2 class="text-xl font-bold ">Ajouter un joueur</h2>

            <button id="fermer" class="text-2xl leading-none text-slate-400 hover:text-white">
              &times;

            </button>
          </div>
          <form id="formulaire">

          <div class="mb-8">
            <label for="nom" class="mb-2 block text-sm font-semibold text-slate-400">
              Nom complet
            </label>

            <input id="nom" type="text" placeholder="Ex. Ayoub Mansouri"
              class="w-full rounded-2xl border-2 border-blue-500 bg-slate-900 px-4 py-3 outline-none placeholder:text-slate-500">
            <p id="valide" class="message"></p>

          </div>

          <fieldset class="mb-6">
            <legend>Poste</legend>

            <div id="check" class="grid grid-cols-2 gap-2">
                <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 p-5 hover:border-amber-500">
                  <input class="accent-amber-500" type="radio" name="poste" value="Gardien">
                  <span class="text-amber-500">●</span> Gardien
                </label>

                <label
                  class ="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 p-5 hover:border-blue-500">
                  <input class="accent-blue-500" type="radio" name="poste" value="Défenseur">
                  <span class="text-blue-500">●</span> Défenseur
                </label>

                <label
                  class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 p-5 hover:border-green-500">
                  <input class="accent-green-500" type="radio" name="poste" value="Milieu">
                  <span class="text-green-500">●</span> Milieu
                </label>

                <label
                  class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 p-5 hover:border-red-500">
                  <input class="accent-red-500" type="radio" name="poste" value="Attaquant">
                  <span class="text-red-500">●</span> Attaquant
                </label>
              </div>
              
              <p id="poste-message" class="message mt-2 text-sm"></p>
      </fieldset>
            <div class="mb-10">
              <label for="numero" class="mb-2 block text-sm font-semibold text-slate-400">
                Numéro (1 à 99)
              </label>

              <input id="numero" type="number" min="1" max="99" placeholder="Ex. 7"
                class="w-full rounded-2xl border-2 border-blue-500 bg-slate-900 px-4 py-3 outline-none placeholder:text-slate-500">
                <p id="numero-message" class="message mt-2 text-sm"></p>
            </div>            

            <div class="flex justify-end gap-3">
              <button id="annuler" class="rounded-xl bg-slate-700 px-5 py-3 font-semibold hover:bg-slate-600">
                Annuler
              </button>
              <button id="ajouter" type="submit" class="rounded-xl bg-green-600 px-5 py-3 font-semibold hover:bg-green-700">
                Ajouter
              </button>
            </div>
            <div class="flex justify-end">
              <p id="form-msg" class="mt-4 text-sm"></p>
            </div>
            

        </div>
        </form>
      </div>
</section>
      <section>
              <p id="message"></p>
<div id="joueurs-container" class="flex flex-col gap-3">
      </section>

  </main>


</body>
</html>
